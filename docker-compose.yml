# Équivalent sans compose :
#   docker build -t llama-cpp-local:latest .
#   docker run -it --rm \
#     --network host \
#     -v "$(pwd)/models:/models" \
#     --env-file .env \
#     -w /models \
#     llama-cpp-local:latest bash

services:
  llama:
    image: llama-cpp-local:latest
    build:
      context: .
      args:
        LLAMA_VERSION: v0.5.0
    container_name: llama
    # Réseau partagé avec l'hôte : llama-server sans --host (boucle locale)
    # n'est joignable que depuis cette machine ; avec --host 0.0.0.0 il est
    # accessible au réseau local. Pas de ports: ni de --service-ports :
    # inutiles en mode hôte.
    network_mode: host
    env_file:
      - path: .env
        required: false
    volumes:
      - ./models:/models
    working_dir: /models
    stdin_open: true
    tty: true
